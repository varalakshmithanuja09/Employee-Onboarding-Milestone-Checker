<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Onboarding Milestone Checker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 400px;
    }

    h2 {
        text-align: center;
        color: #333;
    }

    .milestone {
        margin: 12px 0;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .progress-container {
        margin-top: 20px;
    }

    .progress-bar {
        width: 100%;
        height: 20px;
        background: #e0e0e0;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 0%;
        background: #28a745;
        transition: width 0.3s ease;
    }

    .status {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
        color: #444;
    }

    .completed {
        color: green;
        text-decoration: line-through;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Employee Onboarding Checker</h2>

    <div class="milestone">
        <input type="checkbox" class="task">
        <label>Submit Documents</label>
    </div>

    <div class="milestone">
        <input type="checkbox" class="task">
        <label>HR Orientation</label>
    </div>

    <div class="milestone">
        <input type="checkbox" class="task">
        <label>IT Account Setup</label>
    </div>

    <div class="milestone">
        <input type="checkbox" class="task">
        <label>Training Completion</label>
    </div>

    <div class="milestone">
        <input type="checkbox" class="task">
        <label>Manager Introduction</label>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        <div class="status" id="status">0% Completed</div>
    </div>
</div>

<script>
    const tasks = document.querySelectorAll('.task');
    const progressBar = document.getElementById('progress');
    const status = document.getElementById('status');

    function updateProgress() {
        let completed = 0;

        tasks.forEach(task => {
            const label = task.nextElementSibling;

            if (task.checked) {
                completed++;
                label.classList.add('completed');
            } else {
                label.classList.remove('completed');
            }
        });

        const percentage = Math.round((completed / tasks.length) * 100);

        progressBar.style.width = percentage + '%';
        status.textContent = percentage + '% Completed';

        if (percentage === 100) {
            status.textContent = "🎉 Onboarding Completed!";
        }
    }

    tasks.forEach(task => {
        task.addEventListener('change', updateProgress);
    });
</script>

</body>
</html>
